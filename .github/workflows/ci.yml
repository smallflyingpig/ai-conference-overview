name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e '.[dev]'

      - name: Lint Python
        run: python -m ruff check .

      - name: Test Python
        run: python -m pytest -q

      - name: Check generated release selectors
        run: python scripts/generate_release_selectors.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Test site units
        working-directory: site
        run: npm test

      - name: Verify empty-data build
        working-directory: site
        env:
          CONFERENCE_RELEASE_ROOT: ${{ runner.temp }}/empty-releases
        run: |
          mkdir -p "$CONFERENCE_RELEASE_ROOT"
          npm run build

      - name: Build validated release
        working-directory: site
        run: npm run build

      - name: Run browser acceptance
        working-directory: site
        run: npm run test:e2e
