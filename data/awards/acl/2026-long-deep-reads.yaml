  method_summary:
    claim: For each calibration batch, GISP scores parameters by absolute gradient-times-weight,
      sums scores into structured groups, corrects group-size and attention-versus-MLP
      scale, globally masks the lowest-scoring groups at the next linearly scheduled
      ratio, and recomputes importance on the newly pruned network until the target
      ratio is reached.
