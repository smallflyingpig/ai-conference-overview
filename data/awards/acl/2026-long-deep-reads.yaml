deep_reads:
- contribution:
    claim: GeoRA constructs a geometry-aware weight subspace by uniting low-energy
      spectral entries with low-magnitude Euclidean entries, initializes a dense low-rank
      adapter from that subspace, and subtracts the initialized adapter from a frozen
      residual so the model is function-preserving at initialization.
    evidence_type: paper_reported
    locator: Section 3 and Figure 2, PDF pp. 3-4
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
  data_training_setup:
  - claim: Main math experiments train Qwen3-8B Base and Llama3.1-8B-Instruct on DeepMath-103K
      with GRPO; all PEFT methods use rank 16 and alpha 32, GeoRA uses rho 0.2, AdamW
      with learning rate 1e-6 and BF16, global batch 128, eight rollouts, and one
      random run on 80-GB GPUs.
    evidence_type: paper_reported
    locator: Section 4.1 and Appendix C.1, PDF pp. 4-5 and 14
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
  limitations:
  - claim: GeoRA adds one-time truncated-SVD and masking preprocessing, and the experiments
      emphasize mathematical, medical, and coding RLVR, so generalization to non-verifiable
      rewards and other model families remains open.
    evidence_type: paper_reported
    locator: Limitations, PDF p. 9
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
  method_diagram:
    edges:
    - data_flow_rationale: A rank-r approximation identifies entries with low spectral
        energy.
      source: weight
      target: spectral
    - data_flow_rationale: Entry magnitudes identify a complementary low-energy coordinate
        mask.
      source: weight
      target: euclidean
    - data_flow_rationale: The spectral mask contributes its selected entries to the
        union.
      source: spectral
      target: union
    - data_flow_rationale: The Euclidean mask contributes its selected entries to
        the union.
      source: euclidean
      target: union
    - data_flow_rationale: The geometry-aware matrix is decomposed to initialize adapter
        factors.
      source: union
      target: svd
    - data_flow_rationale: The initialized adapter product is subtracted from W so
        initial outputs are preserved.
      source: svd
      target: residual
    - data_flow_rationale: The initialized dense factors form the only trainable RLVR
        path.
      source: svd
      target: update
    nodes:
    - identifier: weight
      label: Pretrained weight matrix W
      paper_section: Section 3.1
    - identifier: spectral
      label: Low-energy spectral mask
      paper_section: Section 3.1
    - identifier: euclidean
      label: Low-magnitude Euclidean mask
      paper_section: Section 3.1
    - identifier: union
      label: Union geometry-aware matrix
      paper_section: Section 3.1
    - identifier: svd
      label: Top-r SVD adapter initialization
      paper_section: Section 3.2
    - identifier: residual
      label: Frozen function-preserving residual
      paper_section: Section 3.2
    - identifier: update
      label: Dense trainable low-rank RLVR branch
      paper_section: Section 3.3
  method_summary:
    claim: The algorithm approximates each weight matrix at rank r, forms spectral
      and Euclidean bottom-rho masks, takes their union, computes the top-r SVD of
      the masked matrix to initialize adapter factors, freezes W minus the scaled
      adapter product, and optimizes only the dense low-rank branch under RLVR.
    evidence_type: paper_reported
    locator: Sections 3.1-3.3 and Algorithm 1, PDF pp. 3-4
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
  paper_id: acl:2026.acl-long.1110
  prior_work_differences:
  - claim: PiSSA initializes from principal spectral components and MiLoRA from minor
      components without explicitly modeling RLVR geometry; GeoRA instead combines
      spectral and coordinatewise Euclidean low-energy structure while preserving
      the original function.
    evidence_type: paper_reported
    locator: Section 2.2 and Section 3, PDF pp. 2-4
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
  reproducibility_assessment:
  - claim: The paper supplies equations, an initialization algorithm, extensive hyperparameters
      and task configurations, but reports a single random run and does not state
      a public code URL in the paper text, limiting independent variance and implementation
      checks.
    evidence_type: inference
    locator: Algorithm 1, Appendix C.1, and experimental-protocol note, PDF pp. 4
      and 14
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
  research_problem:
    claim: Low-rank adapters designed around supervised-fine-tuning spectra do not
      match the off-principal update geometry observed in reinforcement learning with
      verifiable rewards, whereas direct sparse updates are difficult to translate
      into hardware speedups.
    evidence_type: paper_reported
    locator: Abstract and Sections 1-2, PDF pp. 1-3
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
  result_claims:
  - claim: GeoRA reaches AIME 2024 accuracy 23.75 on Qwen3-8B.
    evaluation_setting: Qwen3-8B Base trained on DeepMath-103K with GRPO and rank-16
      GeoRA
    evidence_type: paper_reported
    locator: Table 1, Qwen3-8B GeoRA row, AIME24 column, PDF p. 5
    metric: AIME 2024 accuracy
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
    value: '23.75'
  - claim: GeoRA reaches average medical-domain accuracy 73.69.
    evaluation_setting: Llama3.1-8B-Instruct RLVR on AlphaMed19K across the medical
      evaluation suite
    evidence_type: paper_reported
    locator: Table 2, medical-domain GeoRA row, Average column, PDF p. 5
    metric: average medical benchmark accuracy
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
    value: '73.69'
  - claim: GeoRA uses 68.43% peak VRAM in the Qwen3-8B efficiency comparison.
    evaluation_setting: Qwen3-8B RLVR efficiency measurement under the paper's common
      training setup
    evidence_type: paper_reported
    locator: Table 3, Qwen3-8B GeoRA row, VRAM column, PDF p. 6
    metric: peak VRAM utilization (%)
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
    value: '68.43'
  transferable_implications:
  - claim: PEFT subspaces should be selected against the geometry of the target optimization
      regime and evaluated on out-of-domain forgetting as well as in-domain reward;
      function-preserving initialization isolates the effect of subsequent training.
    evidence_type: inference
    locator: Derived from Sections 3-4 and the OOD and spectral analyses in Tables
      1 and 6, PDF pp. 3-8
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
  why_it_matters:
  - claim: GeoRA turns an observed RLVR update geometry into a hardware-friendly dense
      adapter, linking mechanistic diagnosis to a practical PEFT design rather than
      assuming an SFT-derived spectral prior transfers unchanged.
    evidence_type: inference
    locator: Synthesis from Sections 2-3 and Tables 1-3, PDF pp. 2-6
    source_urls:
    - https://aclanthology.org/2026.acl-long.1110.pdf
- contribution:
    claim: IMPLICITMEMBENCH operationalizes procedural memory, priming, and classical
      conditioning in a unified learning/priming-interference-test protocol with first-attempt
      scoring across a compact 300-item suite.
    evidence_type: paper_reported
    locator: Sections 1 and 3.1-3.2, Figure 1, PDF pp. 1-5
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
  data_training_setup:
  - claim: More than 1,000 GPT-4o-mini-generated candidates are reduced by automated
      checks, LLM judging, and human review to 300 items balanced 100/100/100 across
      the three paradigms and 18 task families; tested models are zero-shot with no
      task fine-tuning, a 4,096-token response cap, and paradigm-specific temperatures.
    evidence_type: paper_reported
    locator: Sections 3.3-4.1 and Table 6, PDF pp. 6-7
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
  limitations:
  - claim: The benchmark covers only three non-declarative-memory paradigms and omits
      perceptual learning, habit formation, motor skills, and emotional conditioning,
      so it should not be treated as complete coverage of implicit cognition.
    evidence_type: paper_reported
    locator: Limitations, PDF p. 10
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
  method_diagram:
    edges:
    - data_flow_rationale: Section 3 maps each cognitive construct to task families
        and blueprint requirements.
      source: cognitive_constructs
      target: blueprints
    - data_flow_rationale: Section 3.3 filters generated candidates for structure,
        leakage, semantics, and diversity.
      source: blueprints
      target: quality_control
    - data_flow_rationale: Accepted items instantiate the disclosed three-phase protocols.
      source: quality_control
      target: three_phase
    - data_flow_rationale: Section 4.2 scores the first test response using FTA or
        priming influence after interference.
      source: three_phase
      target: first_attempt
    nodes:
    - identifier: cognitive_constructs
      label: Three implicit-memory constructs
      paper_section: Section 3.1, PDF p. 4
    - identifier: blueprints
      label: Structured task blueprints and generated candidates
      paper_section: Section 3.3 and Figure 1, PDF pp. 3 and 6
    - identifier: quality_control
      label: Automated checks, LLM review, and human editing
      paper_section: Section 3.3, PDF p. 6
    - identifier: three_phase
      label: Learning/priming-interference-test interaction
      paper_section: Sections 3.2.1-3.2.3, PDF pp. 4-6
    - identifier: first_attempt
      label: Paradigm-specific first-attempt scores
      paper_section: Section 4.2, PDF pp. 7-8
  method_summary:
    claim: Procedural tasks test one-shot rule acquisition after misleading turns,
      priming uses matched experimental/control thematic exposure, and conditioning
      pairs cues with failures before reintroducing the cue; deterministic validators
      score structured procedures and LLM judges score semantic influence and avoidance.
    evidence_type: paper_reported
    locator: Sections 3.2.1-3.2.3, Tables 2-5, PDF pp. 4-6
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
  paper_id: acl:2026.acl-long.1301
  prior_work_differences:
  - claim: Unlike long-context QA, retrieval, dialogue-state, and selective-forgetting
      benchmarks that use active queries, IMPLICITMEMBENCH uses passive scenario triggers
      and scores the first behavior after interference.
    evidence_type: paper_reported
    locator: Table 1 and Section 2, PDF pp. 2-4
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
  reproducibility_assessment:
  - claim: Code/data availability, compact scale, complete generation and judge prompts,
      cross-judge reranking, context-length sensitivity, and explicit human baselines
      support reproduction; proprietary generator/judge/model versions remain a source
      of drift.
    evidence_type: inference
    locator: Section 1 footnote, Appendix B-F and Tables 9-13, PDF pp. 1 and 11-30
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
  research_problem:
    claim: 'Existing agent-memory benchmarks actively cue factual recall and therefore
      do not measure implicit memory: experience that changes first-attempt behavior
      without an explicit reminder.'
    evidence_type: paper_reported
    locator: Abstract, Section 1, and Table 1, PDF pp. 1-2
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
  result_claims:
  - claim: DeepSeek-R1 is the highest-scoring evaluated model with an overall IMPLICITMEMBENCH
      score of 65.30, still below the paper's two-thirds ceiling and the reported
      human baseline.
    evaluation_setting: 17-model comparison on 300 items; overall is the mean of procedural-memory
      FTA, priming influence score, and classical-conditioning FTA
    evidence_type: paper_reported
    locator: Table 7 and Section 4.3, PDF p. 8
    metric: overall IMPLICITMEMBENCH score
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
    value: '65.3'
  transferable_implications:
  - claim: 'Inference: memory evaluations for agents should include a distractor phase
      and score the first uncued action, otherwise retrieval success can be mistaken
      for consolidation into behavior.'
    evidence_type: inference
    locator: Sections 1 and 3.1-3.2, PDF pp. 1-5
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
  why_it_matters:
  - claim: 'The benchmark shows that explicit storage/retrieval is not equivalent
      to automatized behavior: memory-augmented agents produce paradigm-dependent
      gains and no tested architecture is uniformly strong across the three implicit
      mechanisms.'
    evidence_type: paper_reported
    locator: Section 4.3, Figures 4-6, and Appendix C, PDF pp. 8-10 and 13
    source_urls:
    - https://aclanthology.org/2026.acl-long.1301.pdf
- contribution:
    claim: CURE jointly trains solution generation, critique generation, and critique-guided
      fresh solving in one policy, using delayed verification reward to measure hint
      utility and experience replay to recover successes from initially zero-pass
      problems.
    evidence_type: paper_reported
    locator: Section 3 and Figure 1, PDF pp. 3-5
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
  data_training_setup:
  - claim: Experiments use Qwen2.5-7B-Instruct and Qwen3-4B-Base on a downsampled
      DeepMath set and CodeContests; CURE draws four initial and four guided solutions
      plus one critique, trains math for 600 steps with batch 128 and code for 300
      steps with batch 32, uses learning rate 1e-6, rollout temperature 1, maximum
      prompt/response lengths 6,144/4,096, and four A800 GPUs.
    evidence_type: paper_reported
    locator: Section 4.1 and Appendix D, PDF pp. 6 and 16-17
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
  limitations:
  - claim: CURE is evaluated only where answers admit verifiable rewards, principally
      math and code, and its extra critique and guided rollouts increase per-step
      training compute.
    evidence_type: paper_reported
    locator: Limitations, PDF pp. 9-10; training-time breakdown in Appendix Table
      7, PDF p. 17
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
  method_diagram:
    edges:
    - data_flow_rationale: The current policy samples an initial group of candidate
        solutions.
      source: question
      target: initial
    - data_flow_rationale: Each candidate is scored by the task verifier.
      source: initial
      target: verifier
    - data_flow_rationale: Zero- and partial-pass outcomes are selected into a balanced
        critique batch.
      source: verifier
      target: critique
    - data_flow_rationale: Only the question and high-level hint condition fresh guided
        sampling.
      source: critique
      target: guided
    - data_flow_rationale: Guided candidates are verified to measure correction success.
      source: guided
      target: verifier
    - data_flow_rationale: Mean guided accuracy supplies delayed hint reward and successful
        trajectories enter replay.
      source: verifier
      target: reward
    - data_flow_rationale: Replay and delayed rewards feed the three jointly optimized
        objectives.
      source: reward
      target: objective
    - data_flow_rationale: The unified policy update changes the next generation and
        critique cycle.
      source: objective
      target: initial
    nodes:
    - identifier: question
      label: Problem prompt
      paper_section: Section 3.1
    - identifier: initial
      label: Initial solution group
      paper_section: Section 3.1
    - identifier: verifier
      label: Binary verifier
      paper_section: Section 3.1
    - identifier: critique
      label: Selective verification plus high-level hint
      paper_section: Sections 3.1-3.2
    - identifier: guided
      label: Fresh guided solution group
      paper_section: Section 3.1
    - identifier: reward
      label: Delayed hint reward and replay buffer
      paper_section: Sections 3.2-3.3
    - identifier: objective
      label: Unified solve, critique, and guided objectives
      paper_section: Section 3.4
  method_summary:
    claim: CURE samples initial solutions and verifies them; selectively builds a
      balanced critique batch from zero- and partial-pass cases; emits a verification
      decision plus a high-level hint; discards the wrong solution before fresh guided
      resampling; and optimizes equally weighted solution, critique, and guided-solution
      objectives, with the critique advantage combining fixed verification supervision
      and centered delayed hint reward.
    evidence_type: paper_reported
    locator: Sections 3.1-3.4, Figure 1, PDF pp. 3-5
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
  paper_id: acl:2026.acl-long.1321
  prior_work_differences:
  - claim: Unlike external-critic or ground-truth-dependent correction and unlike
      methods that condition revision on the full erroneous answer, CURE trains an
      internal critique and carries only a high-level hint into a fresh solve to reduce
      anchoring.
    evidence_type: paper_reported
    locator: Section 2 and Section 3.1, PDF pp. 2-4
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
  reproducibility_assessment:
  - claim: The paper discloses prompts, objectives, rollout counts, optimization settings
      and hardware, but it does not state a public code release in the paper and the
      exact downsampled training-instance list is not enumerated.
    evidence_type: inference
    locator: Sections 3-4 and Appendix D, PDF pp. 3-6 and 16-17
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
  research_problem:
    claim: Parallel best-of-N sampling and ordinary RLVR do not teach a model to verify,
      critique, and correct its own response sequentially, while prior critique systems
      commonly require an external teacher or expose the incorrect solution and thereby
      induce anchoring.
    evidence_type: paper_reported
    locator: Abstract, Section 1, and Section 2, PDF pp. 1-3
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
  result_claims:
  - claim: Qwen2.5-7B trained with CURE improves its eight-round math average to 44.9.
    evaluation_setting: Qwen2.5-7B-Instruct CURE, conditional self-improvement for
      up to eight rounds over the reported math benchmarks
    evidence_type: paper_reported
    locator: Table 1, Qwen2.5-7B CURE row, Math Self-Improve T=8 average, PDF p. 7
    metric: eight-round math average accuracy
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
    value: '44.9'
  - claim: On AIME 2025, Qwen2.5-7B CURE reaches 16.0 after eight self-improvement
      rounds.
    evaluation_setting: Qwen2.5-7B-Instruct CURE with conditional test-time self-improvement
      up to T=8
    evidence_type: paper_reported
    locator: Table 1, Qwen2.5-7B CURE row, AIME25 / T=8 column, PDF p. 7
    metric: AIME 2025 accuracy after eight rounds
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
    value: '16.0'
  - claim: On MATH500 at the eighth round, CURE obtains accuracy 82.8.
    evaluation_setting: CURE conditional sequential self-improvement at T=8 on MATH500
    evidence_type: paper_reported
    locator: Table 3, CURE T=8 row, Accuracy column, PDF p. 8
    metric: MATH500 accuracy
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
    value: '82.8'
  transferable_implications:
  - claim: A self-correction pipeline should separately supervise critique correctness
      and score whether its hint improves a fresh attempt; removing the erroneous
      trajectory from the correction context is a testable anti-anchoring intervention.
    evidence_type: inference
    locator: Derived from Sections 3.1-3.4 and the ablations in Section 4.3, PDF pp.
      3-5 and 8-9
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
  why_it_matters:
  - claim: The work turns test-time compute from independent sampling into a learned
      sequential control loop whose intermediate critique is itself trained for downstream
      utility, not merely surface correctness.
    evidence_type: inference
    locator: Synthesis from Section 3, Figure 1, and Tables 1 and 3, PDF pp. 3-8
    source_urls:
    - https://aclanthology.org/2026.acl-long.1321.pdf
- contribution:
    claim: The paper proposes ease of transfer learning as a form-sensitive complexity
      measure, integrates it with communicative accuracy, and compares attested pronoun
      and verb paradigms against structural and form-only counterfactuals across a
      massively multilingual sample.
    evidence_type: paper_reported
    locator: Sections 3-5, PDF pp. 3-8
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
  data_training_setup:
  - claim: The analysis includes 561 PPD languages and 93,845 PPD permutations, plus
      family-stratified PRON and VERB datasets; each factual system is trained with
      10 networks and each counterfactual with 5 networks, using batch size 1, dropout
      0.5, and a 50-epoch learning-curve horizon.
    evidence_type: paper_reported
    locator: Sections 3.1-3.2, Table 3, and Appendix B, PDF pp. 3-7 and appendix data
      description
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
  limitations:
  - claim: The evidence is confined to discrete inflectional paradigms; CETL is not
      claimed to dominate information-bottleneck complexity universally, feature-weight
      optimization is not replicated, and the counterfactual space is sampled rather
      than exhaustive.
    evidence_type: paper_reported
    locator: Limitations and discussion, PDF p. 9
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
  method_diagram:
    edges:
    - data_flow_rationale: Corpus paradigms provide feature bundles, surface strings,
        and empirical need distributions.
      source: paradigms
      target: meanings
    - data_flow_rationale: Observed systems are permuted to create controlled structural
        and form-only alternatives.
      source: meanings
      target: counterfactuals
    - data_flow_rationale: The learner maps semantic feature sequences to character
        strings.
      source: meanings
      target: learner
    - data_flow_rationale: The same learner is trained on each counterfactual system.
      source: counterfactuals
      target: learner
    - data_flow_rationale: Cross-entropy decay over training steps is integrated into
        CETL complexity.
      source: learner
      target: cetl
    - data_flow_rationale: Forms and need probabilities define Bayesian reconstruction
        accuracy.
      source: meanings
      target: listener
    - data_flow_rationale: Complexity is compared between attested and counterfactual
        systems.
      source: cetl
      target: comparison
    - data_flow_rationale: Accuracy supplies the second efficiency coordinate.
      source: listener
      target: comparison
    nodes:
    - identifier: paradigms
      label: Attested paradigms and need frequencies
      paper_section: Sections 3.1 and 4
    - identifier: meanings
      label: Meaning-feature vectors and character forms
      paper_section: Section 3.1
    - identifier: counterfactuals
      label: Structural and form-only permutations
      paper_section: Section 3.2
    - identifier: learner
      label: LSTM meaning-to-form learner
      paper_section: Section 3.1.1
    - identifier: cetl
      label: Need-weighted learning-curve CETL complexity
      paper_section: Section 3.1.1
    - identifier: listener
      label: Bayesian listener and communicative accuracy
      paper_section: Section 3.1.2
    - identifier: comparison
      label: Attested versus counterfactual efficiency comparison
      paper_section: Section 5
  method_summary:
    claim: Meanings are feature vectors and forms are character strings; a two-stack
      LSTM encoder-decoder learns the meaning-to-form mapping, and complexity is the
      need-weighted average cross-entropy learning curve over training time. A Bayesian
      listener supplies communicative accuracy, while structural permutations alter
      syncretism and form-only permutations preserve syncretism but scramble within-form
      systematicity.
    evidence_type: paper_reported
    locator: Sections 3.1-3.2 and Figure 2, PDF pp. 3-5
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
  paper_id: acl:2026.acl-long.1340
  prior_work_differences:
  - claim: Earlier information-bottleneck work measures the mapping between meanings
      and atomic forms, while earlier neural learnability measures do not target form-level
      systematicity under controlled syncretism; CETL explicitly learns character
      realization.
    evidence_type: paper_reported
    locator: Section 3.1.2 and related-work discussion, PDF p. 4
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
  reproducibility_assessment:
  - claim: The paper links code and data and discloses representations, learner design,
      sampling and robustness analyses; replication still depends on multilingual
      paradigms assembled from heterogeneous sources and transliteration choices.
    evidence_type: inference
    locator: Repository link and data statement; Sections 3-4 and Appendices, PDF
      pp. 3-7 and supplementary pages
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
  research_problem:
    claim: Information-bottleneck accounts of morphological efficiency treat surface
      forms as atomic symbols, so they can model syncretism but cannot measure systematicity
      inside character sequences or distinguish equally syncretic form systems with
      different learnability.
    evidence_type: paper_reported
    locator: Abstract, Section 1, and Section 3.1, PDF pp. 1-4
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
  result_claims:
  - claim: On the PPD pronoun data, CETL attains a structural-counterfactual Perf
      score of 70.19.
    evaluation_setting: Attested PPD pronoun systems compared with structural permutations
      using CETL complexity
    evidence_type: paper_reported
    locator: Table 4, PPD / Structural / CETL / Perf entry, PDF p. 8
    metric: Perf score against structural counterfactuals
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
    value: '70.19'
  - claim: On the PRON family-level data, CETL attains a form-only-counterfactual
      Perf score of 78.42.
    evaluation_setting: Attested PRON paradigms compared with syncretism-preserving
      form-only permutations using CETL
    evidence_type: paper_reported
    locator: Table 4, PRON / Form-only / CETL / Perf entry, PDF p. 8
    metric: Perf score against form-only counterfactuals
    source_urls:
    - https://aclanthology.org/2026.acl-long.1340.pdf
    value: '78.42'
