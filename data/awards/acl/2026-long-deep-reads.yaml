- contribution:
    claim: GISP is a global iterative structured-pruning paradigm that computes task-objective
      gradients, aggregates first-order importance by attention head or MLP channel,
      normalizes the two block types, and repeatedly prunes the globally least important
      structures along a schedule, yielding nested subnetworks without recovery training.
    evidence_type: paper_reported
    locator: Section 3, Figure 2, and Algorithm 1, PDF pp. 4-6
