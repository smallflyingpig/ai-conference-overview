  data_training_setup:
  - claim: Perplexity calibration uses 500 C4 sequences of length 2,048; common-sense
      calibration uses a balanced 512K-token mixture from seven tasks; GSM8K uses
      500 examples. Seven- and eight-billion-parameter models use 112 pruning steps
      of 0.625 percentage points each, 13B uses 280 steps of 0.25 points, with BF16,
      seed 0, and no retraining or recovery.
    evidence_type: paper_reported
    locator: Section 4 and Appendix A.3, PDF pp. 7 and 13
    source_urls:
    - https://aclanthology.org/2026.acl-long.1653.pdf
  limitations:
  - claim: Gradient-based importance requires additional memory and compute, and the
      study does not test mixture-of-experts architectures.
    evidence_type: paper_reported
    locator: Limitations, PDF p. 10
    source_urls:
    - https://aclanthology.org/2026.acl-long.1653.pdf
  method_diagram:
    edges:
    - data_flow_rationale: The selected objective is differentiated on calibration
        examples.
      source: calibration
      target: gradients
    - data_flow_rationale: Parameter saliencies are summed over each removable structure.
      source: gradients
      target: groups
    - data_flow_rationale: Scores are corrected for group size and attention-versus-MLP
        scale.
      source: groups
      target: normalize
    - data_flow_rationale: Normalized group scores enter one global ordering.
      source: normalize
      target: rank
    - data_flow_rationale: The next scheduled fraction of least-important groups is
        masked.
      source: rank
      target: mask
    - data_flow_rationale: Applying the mask produces the next nested subnetwork.
      source: mask
      target: subnet
    - data_flow_rationale: Importance is recomputed on the changed network for the
        next pruning step.
      source: subnet
      target: calibration
